services:
  - type: web
    name: demand-intel
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter  # Free instances cannot use disks - persistence requires paid plan (starter) for disk
    healthCheckPath: /api/status
    disk:
      name: demand-intel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
      - key: DB_PATH
        value: /var/data/demand_intel.db
      - key: REFRESH_INTERVAL_MINUTES
        value: 60
      - key: PYTHONUNBUFFERED
        value: 1
